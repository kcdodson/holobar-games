name: Update game list

on:
  schedule:
    - cron: '17 9 * * 1'      # Mondays 09:17 UTC
  workflow_dispatch:
    inputs:
      spy_pages:
        description: 'SteamSpy pages to read (1000 apps each, 1 page per minute)'
        default: '25'

permissions:
  contents: write
  pages: write

concurrency:
  group: update-game-list
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build the index (SteamSpy + Steam store data)
        env:
          SPY_PAGES: ${{ github.event.inputs.spy_pages || '25' }}
        run: node build/build.mjs

      - name: Commit only if the data changed
        id: commit
        run: |
          git add -A v1 data
          if git diff --cached --quiet; then
            echo "No data changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update game list $(node -p "require('./v1/meta.json').v") ($(node -p "require('./v1/meta.json').count") games)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Ask GitHub Pages to rebuild
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages build request not needed / not allowed; the push normally triggers it."
